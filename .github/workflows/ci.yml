name: CleanTrack CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Seed Database
      run: |
        python -m backend.seed_data

    - name: Run Backend API Test Suite
      run: |
        python -c "
        import uvicorn, threading, time, sys
        from backend.app import app
        server = threading.Thread(target=uvicorn.run, args=(app,), kwargs={'host': '127.0.0.1', 'port': 8000}, daemon=True)
        server.start()
        time.sleep(2)
        import backend.test_api
        backend.test_api.test_endpoints()
        "
